name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        node: [22.19.0, 24.18.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/coding-agent/package-lock.json
      - run: npm ci
      - run: npm --prefix packages/pebble-protocol run build
      - run: npm ci --prefix examples/coding-agent --ignore-scripts
      - run: npm test
      - run: npm run license:check
      - run: npm run pack:check

  clean-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      # Pack every publishable workspace, then install the tarballs into a
      # throwaway project outside the checkout. Fails if a package ships a
      # local dependency spec, misses a file, or breaks its documented entry
      # points. No provider credential, so this exercises packaging only.
      - run: npm pack --workspaces --pack-destination "$RUNNER_TEMP/tgz"
      - name: Install packed tarballs and run documented entry points
        working-directory: ${{ runner.temp }}
        run: |
          mkdir clean-room && cd clean-room
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/tgz/*.tgz
          node --input-type=module -e '
            const m = await import("@caveman-ai/agent");
            for (const name of ["agent", "auto", "run", "tool", "schema"]) {
              if (!(name in m)) throw new Error(`missing_export:${name}`);
            }
            await import("@caveman-ai/agent/wire");
            await import("@pebble-agent/protocol");
          '
          npx --no-install caveman-agent --version

  windows-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --prefix packages/pebble-protocol run build
      - run: npm --prefix packages/agent run build
      - run: node --test packages/agent/tests/windows-process.runtime.mjs packages/agent/tests/windows-shell-smoke.runtime.mjs
